<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vilches Abogados - Registro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="nav-placeholder"></div>

<section class="auth-section">
  <div class="auth-card">
    <div class="auth-icon"><i class="fas fa-user-plus"></i></div>
    <h2>Crear Cuenta</h2>
    <p>Regístrese para gestionar sus citas</p>
    <form id="registerForm">
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" id="regNombre" required placeholder="Juan Pérez">
      </div>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="regEmail" required placeholder="correo@ejemplo.com">
      </div>
      <div class="form-group">
        <label>Contraseña (mín. 6 caracteres)</label>
        <input type="password" id="regPassword" required placeholder="••••••" minlength="6">
      </div>
      <button type="submit" class="btn-auth btn-auth-primary">Crear Cuenta</button>
    </form>
    <div class="auth-footer">
      ¿Ya tiene cuenta? <a href="login.html">Inicie sesión</a>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="js/main.js"></script>
</body>
</html>
