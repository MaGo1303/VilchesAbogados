<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vilches Abogados - Iniciar Sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="nav-placeholder"></div>

<section class="auth-section">
  <div class="auth-card">
    <div class="auth-icon"><i class="fas fa-user-lock"></i></div>
    <h2>Iniciar Sesión</h2>
    <p>Acceda a su panel de citas</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="loginEmail" required placeholder="correo@ejemplo.com">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" required placeholder="••••••">
      </div>
      <button type="submit" class="btn-auth btn-auth-primary">Iniciar Sesión</button>
    </form>
    <div class="auth-footer">
      ¿No tiene cuenta? <a href="register.html">Regístrese aquí</a>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="js/main.js"></script>
</body>
</html>
